name: CD - Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # Tunggu CI selesai dulu
  check-ci:
    name: Wait for CI to Pass
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: "Run Tests"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  deploy:
    name: Deploy to EC2 Production
    needs: check-ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://ec2-47-129-85-94.ap-southeast-1.compute.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd /home/ubuntu/portfolio-cms-backend || {
              echo "❌ Project directory not found!"
              exit 1
            }

            echo "📥 Pulling latest changes..."
            git pull origin main || git pull origin master

            echo "📦 Installing dependencies..."
            npm ci --production

            echo "📝 Updating environment variables..."
            cat > .env << 'EOF'
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NODE_ENV=production
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EOF

            echo "🗄️ Running database migrations..."
            npx prisma migrate deploy

            echo "🔄 Restarting application with PM2..."
            if pm2 describe portfolio-cms-backend > /dev/null 2>&1; then
              pm2 restart portfolio-cms-backend
              echo "✅ Application restarted"
            else
              pm2 start npm --name "portfolio-cms-backend" -- start
              echo "✅ Application started"
            fi

            # Save PM2 process list
            pm2 save

            echo "📊 Application status:"
            pm2 status portfolio-cms-backend

            echo "✅ Deployment completed successfully!"

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to EC2 successful!"
          else
            echo "❌ Deployment to EC2 failed!"
          fi
