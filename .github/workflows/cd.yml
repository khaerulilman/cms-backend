name: CD - Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Only deploy if CI passes (on push to main, CI runs in parallel)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "========== Starting deployment =========="

            # Navigate to project directory
            cd ~/portfolio-cms-backend/backend-express || {
              echo "Project directory not found. Cloning repository..."
              cd ~
              git clone ${{ secrets.REPO_URL }} portfolio-cms-backend
              cd ~/portfolio-cms-backend/backend-express
            }

            # Pull latest changes
            echo "Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies
            echo "Installing dependencies..."
            npm ci --production

            # Generate Prisma Client
            echo "Generating Prisma Client..."
            npx prisma generate

            # Run database migrations
            echo "Running database migrations..."
            npx prisma migrate deploy

            # Restart application with PM2
            echo "Restarting application..."
            if pm2 describe portfolio-cms > /dev/null 2>&1; then
              pm2 restart portfolio-cms
            else
              pm2 start src/server.js --name portfolio-cms --env production
            fi

            pm2 save

            echo "========== Deployment complete =========="
