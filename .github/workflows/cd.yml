name: CD - Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Only deploy if CI passes (on push to main, CI runs in parallel)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "========== Starting deployment =========="

            cd ~

            # Clone once if not exists
            if [ ! -d "cms-backend/.git" ]; then
              echo "Cloning repository..."
              git clone git@github.com:khaerulilman/cms-backend.git cms-backend
            fi

            cd ~/cms-backend || exit 1

            echo "Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm install --omit=dev

            echo "Generating Prisma Client..."
            npx prisma generate

            echo "Running database migrations..."
            npx prisma migrate deploy

            echo "Restarting application..."

            if pm2 describe portfolio-cms > /dev/null 2>&1; then
              pm2 restart portfolio-cms
            else
              pm2 start src/server.js --name portfolio-cms
            fi

            pm2 save

            echo "========== Deployment complete =========="
